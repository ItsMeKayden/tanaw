x-pending-team-agreement:
  - Which modules communicate directly with each other
  - Which module owns each dataset and is responsible for writes
  - Endpoint paths and HTTP methods
  - Request and response field names, data types, and validation rules
  - Required versus optional fields for each operation
  - Standard success and error response formats
  - Authentication and authorization requirements
  - API versioning and deployment base URLs
  - Whether API payloads use database field names or a separate DTO naming convention
  - Whether the Prisma models User and tbl_user_account represent separate account systems

x-schema-observations:
  source: "Prisma schema supplied by the project team"
  notes:
    - "tbl_course_recommendation has a composite primary key: application_id and program_id."
    - "tbl_application references applicant, school, barangay, branch, program, admission cycle, and current admission stage."
    - "tbl_program_competency has a composite primary key: program_id and competency_id."
    - "tbl_question_response has a composite primary key: result_id and question_id."
    - "User and tbl_user_account are both present in the supplied Prisma schema; their intended relationship is not confirmed."
