openapi: 3.1.0

info:
  title: TANAW Shared API Contract
  version: 0.1.0
  description: |
    Shared API contract for the TANAW system.

    This file is the proposed single source of truth for inter-module API
    agreements. The five module names are confirmed. Endpoint paths, HTTP
    methods, request and response payloads, authentication requirements,
    and error formats remain pending team agreement unless explicitly
    approved and documented here.

    Database model information below is reference material derived from
    the supplied Prisma schema. It is not, by itself, an agreed public API
    request or response format.

servers: []

tags:
  - name: Dashboard
    description: Module identified by the project team; API operations pending team agreement.
  - name: Map Module
    description: Module identified by the project team; API operations pending team agreement.
  - name: Admission System
    description: Module identified by the project team; API operations pending team agreement.
  - name: Analytics and Reports
    description: Module identified by the project team; API operations pending team agreement.
  - name: Course Recommendation
    description: Module identified by the project team; API operations pending team agreement.

paths: {}

components:
  schemas: {}
  responses: {}

